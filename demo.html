<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Directory</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 20px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }
    .search-box {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #4CAF50;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .contact-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .contact-item {
      background: #fff;
      margin: 10px 0;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .contact-item span {
      font-size: 16px;
      font-weight: 500;
      color: #333;
    }
    .contact-item a {
      margin-top: 8px;
      background: #4CAF50;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      transition: 0.3s;
    }
    .contact-item a:hover {
      background: #45a049;
    }
    .error {
      text-align: center;
      color: red;
      font-size: 16px;
      margin-top: 20px;
      display: none;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .contact-item {
        flex-direction: column;
        align-items: flex-start;
      }
      .contact-item a {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <h2>📞 Contact Directory</h2>
  <input type="text" id="search" class="search-box" placeholder="Search by name, surname, or number...">

  <ul class="contact-list" id="contactList">
    <!-- Default Contacts -->
    <li class="contact-item default">
      <span>Default One - 9876543210</span>
      <a href="tel:9876543210">Call</a>
    </li>
    <li class="contact-item default">
      <span>Default Two - 9123456780</span>
      <a href="tel:9123456780">Call</a>
    </li>
  </ul>

  <p class="error" id="errorMsg">❌ Not found. Submit your details to <b>Tushar Sutariya</b>.</p>

  <script>
    const search = document.getElementById("search");
    const contactList = document.getElementById("contactList");
    const errorMsg = document.getElementById("errorMsg");

    // Directory Data
    const contacts = [
      { name: "Jay Goti", number: "9876543210" },
      { name: "Rohit Patel", number: "9123456780" },
      { name: "Milan Shah", number: "9988776655" },
      { name: "Yug Thakor", number: "9090909090" },
      { name: "Jay Goti", number: "9898989898" }, // duplicate test
      { name: "Divay Joshi", number: "8000000000" },
    ];

    function renderContacts(list) {
      contactList.innerHTML = "";
      list.forEach(c => {
        const li = document.createElement("li");
        li.className = "contact-item";
        li.innerHTML = `<span>${c.name} - ${c.number}</span>
                        <a href="tel:${c.number}">Call</a>`;
        contactList.appendChild(li);
      });
    }

    // On search input
    search.addEventListener("keyup", function() {
      const value = this.value.toLowerCase().trim();

      if (value === "") {
        // Show default contacts
        contactList.innerHTML = `
          <li class="contact-item default">
            <span>Default One - 9876543210</span>
            <a href="tel:9876543210">Call</a>
          </li>
          <li class="contact-item default">
            <span>Default Two - 9123456780</span>
            <a href="tel:9123456780">Call</a>
          </li>`;
        errorMsg.style.display = "none";
        return;
      }

      // Filter contacts
      const filtered = contacts.filter(c =>
        c.name.toLowerCase().includes(value) ||
        c.number.includes(value)
      );

      if (filtered.length > 0) {
        renderContacts(filtered);
        errorMsg.style.display = "none";
      } else {
        contactList.innerHTML = "";
        errorMsg.style.display = "block";
      }
    });
  </script>

</body>
</html>
