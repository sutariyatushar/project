<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaaS Hero Section</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
/* Slideshow container */
.slideshow-container {
  max-width: 1000px;
  margin: 40px auto;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  position: relative;
}

/* Each slide */
.mySlides {
  display: none;
  width: 100%;
  height: 400px;
  position: absolute;
  top: 0;
  left: 0;
}

/* Slide images */
.mySlides img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 12px;
}

/* Fade + slide animation */
.fade {
  animation: fadeSlide 1s ease-in-out;
}

@keyframes fadeSlide {
  0% {opacity: 0; transform: translateY(30px);}
  50% {opacity: 0.7; transform: translateY(-10px);}
  100% {opacity: 1; transform: translateY(0);}
}

/* Navigation arrows */
.prev, .next {
  cursor: pointer;
  position: absolute;
  top: 50%;
  padding: 12px;
  color: white;
  font-weight: bold;
  font-size: 2rem;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  user-select: none;
  transform: translateY(-50%);
  transition: background 0.3s;
  z-index: 5;
}

.prev:hover, .next:hover {
  background: rgba(0,0,0,0.8);
}

.prev { left: 10px; }
.next { right: 10px; }

/* Responsive for mobile */
@media (max-width: 768px) {
  .mySlides { height: 250px; }
  .prev, .next { font-size: 1.5rem; padding: 8px; }
}

  </style>
</head>
<body>
<header>
  <section id="gallery" data-aos="zoom-in-up">
    <h2 style="text-align: center;">📸 Goradka Memories</h2>

    <div class="slideshow-container">
      <div class="mySlides fade">
        <img src="g5.jpeg" alt="Goradka Nature 1">
      </div>
      <div class="mySlides fade">
        <img src="g6.jpeg" alt="Goradka Temple">
      </div>
      <div class="mySlides fade">
        <img src="g7.jpeg" alt="Goradka Festival">
      </div>
      <div class="mySlides fade">
        <img src="g4.jpeg" alt="Goradka River">
      </div>

      <!-- Navigation Arrows -->
      <a class="prev">&#10094;</a>
      <a class="next">&#10095;</a>
    </div>
  </section>
</header>
<script>
let slideIndex = 1;
const slides = document.getElementsByClassName("mySlides");
const totalSlides = slides.length;

// Show slide function
function showSlides(n) {
  if (n > totalSlides) slideIndex = 1;
  else if (n < 1) slideIndex = totalSlides;
  else slideIndex = n;

  for (let i = 0; i < totalSlides; i++) slides[i].style.display = "none";

  slides[slideIndex - 1].style.display = "block";
}

// Initialize first slide
window.onload = () => showSlides(slideIndex);

// Next / Prev Controls
document.querySelector(".prev").addEventListener("click", () => showSlides(slideIndex - 1));
document.querySelector(".next").addEventListener("click", () => showSlides(slideIndex + 1));

// Auto-play every 3 seconds
setInterval(() => { showSlides(slideIndex + 1); }, 3000);

// Mobile Swipe Support
let startX = 0;
let endX = 0;
const container = document.querySelector(".slideshow-container");

container.addEventListener("touchstart", (e) => { startX = e.touches[0].clientX; });
container.addEventListener("touchend", (e) => {
  endX = e.changedTouches[0].clientX;
  if (startX - endX > 50) showSlides(slideIndex + 1); // swipe left
  if (startX - endX < -50) showSlides(slideIndex - 1); // swipe right
});

</script>
</body>
</html>
