<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .stack-services {
      padding: 60px 20px;
      background: #f4f6f9;
      text-align: center;
    }

    .stack-container {
      position: relative;
      height: 240px;
      max-width: 340px;
      margin: auto;
    }

    .stack-card {
      position: absolute;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      transition: all 0.5s ease;
      opacity: 0;
      transform: scale(0.9) translateY(30px);
    }

    .stack-card.active {
      opacity: 1;
      transform: scale(1) translateY(0);
      z-index: 2;
    }

    .card-top {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
    }

    .card-image {
      width: 70px;
      height: 70px;
      background: #e7f5ec;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .modern-call {
      display: block;
      padding: 12px;
      background: linear-gradient(135deg, #12aa40, #30a24b);
      color: white;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
    }

    .stack-buttons {
      margin-top: 30px;
    }

    .stack-buttons button {
      border: none;
      background: #fff;
      font-size: 24px;
      padding: 10px 15px;
      margin: 0 10px;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      cursor: pointer;
    }
  </style>
  <body>
    <section class="stack-services">
      <h2 class="section-title">Village Services</h2>

      <div class="stack-container">
        <div class="stack-card active">
          <div class="card-top">
            <div class="card-image">🩺</div>
            <div>
              <h3>Sanjaybhai Yadav</h3>
              <p>Village Doctor</p>
            </div>
          </div>
          <a href="tel:9723699000" class="modern-call">📞 97236 99000</a>
        </div>

        <div class="stack-card">
          <div class="card-top">
            <div class="card-image">📚</div>
            <div>
              <h3>Village Library</h3>
              <p>Knowledge & Culture</p>
            </div>
          </div>
          <a href="tel:0000000000" class="modern-call">📞 Call</a>
        </div>

        <div class="stack-card">
          <div class="card-top">
            <div class="card-image">📸</div>
            <div>
              <h3>Vinodbhai Sarvaiya</h3>
              <p>Madhuli Studio</p>
            </div>
          </div>
          <a href="tel:9714888743" class="modern-call">📞 97148 88743</a>
        </div>
      </div>

      <div class="stack-buttons">
        <button id="prev">&#10094;</button>
        <button id="next">&#10095;</button>
      </div>
    </section>
    <script>
      const cards = document.querySelectorAll(".stack-card");
      const next = document.getElementById("next");
      const prev = document.getElementById("prev");

      let current = 0;

      function showCard(index) {
        cards.forEach((card) => card.classList.remove("active"));
        cards[index].classList.add("active");
      }

      next.addEventListener("click", () => {
        current++;
        if (current >= cards.length) current = 0;
        showCard(current);
      });

      prev.addEventListener("click", () => {
        current--;
        if (current < 0) current = cards.length - 1;
        showCard(current);
      });
    </script>
  </body>
</html>
